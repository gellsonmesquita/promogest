# PromoGest · Coolify (Build Pack: Docker Compose) — mesmo padrão do gcs-site.
# Variáveis a definir no Coolify: DATABASE_URL e SESSION_SECRET. Domínio → porta 3000.
# Fora do Coolify: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  app:
    build: .
    expose:
      - "3000"
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=Africa/Luanda
